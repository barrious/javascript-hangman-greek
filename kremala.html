<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΚΡΕΜΑΛΑ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>ΠΛΗΡΟΦΟΡΙΚΗ <br>ΚΡΕΜΑΛΑ</h1>
        
        <div id="word-display" class="word-style"></div><br>

        <div class="input-section">
            <input type="text" id="user-input" maxlength="1" placeholder="γράμμα"><br><br><br>
            <button id="guess-button">Μάντεψε!</button>
        </div>

        <div class="stats">
            Λάθη: <span id="mistakes">0</span> / <span id="max-mistakes">5</span>
        </div>
        
        <div id="message-board"></div>

        <button id="reset-button">Νέο παιχνίδι</button>
    </div>
   
    
    <script src="script.js"></script>
</body>
</html>
