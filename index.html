<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΚΡΕΜΑΛΑ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-layout">
        
        <!-- ΣΤΗΛΗ 1 (ΑΡΙΣΤΕΡΑ): Το διακοσμητικό σκοινί που κουνιέται -->
        <div class="left-rope-column">
            <img src="images/rope.png" id="rope" alt="Σκοινί">
        </div>

        <!-- ΣΤΗΛΗ 2 (ΜΕΣΗ): Η Λογική του Παιχνιδιού -->
        <div class="game-container">
            <h1>ΛΟΓΙΣΜΙΚΗ <br>ΚΡΕΜΑΛΑ</h1>
            
            <div id="word-display" class="word-style"></div><br>
            <div id="alphabet-container"></div>

            <div class="stats">
                Λάθη: <span id="mistakes">0</span> / <span id="max-mistakes">5</span>
            </div>
            
            <div id="message-board"></div>
            <button id="reset-button">Νέο παιχνίδι</button>
        </div>

        <!-- ΣΤΗΛΗ 3 (ΔΕΞΙΑ): Η εικόνα που αλλάζει στάδια ανάλογα με το λάθος -->
        <div class="gallows-section">
            <img src="images/letter_0.png" id="hangman-visual" alt="Hangman State">
        </div>

    </div> <!-- Τέλος main-layout -->

    <script src="script.js"></script>
</body>
</html>
